services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.3
    container_name: keycloak
    environment:
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KEYCLOAK_ADMIN: "admin"
      KEYCLOAK_ADMIN_PASSWORD: "admin"
      KC_LOG_LEVEL: "INFO"
      KC_HTTPS_REQUIRED: none
      DEBUG: "true"
      DEBUG_PORT: "*:5005"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY: edge
    command: ["start-dev"]
    ports:
      - 8080:8080
      - 5005:5005
    volumes:
      - ./target/keycloak-custom-multi-attributes-idp-linking-v1.1.0-SNAPSHOT.jar:/opt/keycloak/providers/keycloak-custom-multi-attributes-idp-linking-v1.1.0-SNAPSHOT.jar

